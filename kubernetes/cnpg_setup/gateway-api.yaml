# --- 1. RATE LIMIT DEFINITION ---
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: pg-rate-limit-def
  namespace: app
spec:
  snippets:
    - context: http
      value: "limit_req_zone $binary_remote_addr zone=pg_limit:10m rate=2r/m;"
---
# --- 2. RATE LIMIT APPLICATION ---
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: pg-rate-limit-app
  namespace: app
spec:
  snippets:
    - context: http.server.location
      value: "limit_req zone=pg_limit nodelay;"
---
# --- 3. SESSION STICKINESS (Location Context Fix) ---
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: pg-stickiness
  namespace: app
spec:
  snippets:
    - context: http.server.location
      # We use a rewrite/header approach since upstream context is blocked
      value: |
        proxy_set_header X-Sticky-Session $cookie_pg_sticky;
        add_header Set-Cookie "pg_sticky=$upstream_addr; Path=/; HttpOnly";
---
# --- 4. HTTP ROUTE ---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pg-reader-route
  namespace: app
spec:
  parentRefs:
  - name: pg-app-gateway
    namespace: gateway-system
  hostnames:
  - "pg-explorer.homelab"
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: pg-rate-limit-def
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: pg-rate-limit-app
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: pg-stickiness
    matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: pg-reader-service
      port: 80
