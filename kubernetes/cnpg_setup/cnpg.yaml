    # # Fix 1: Map the pod name to a 'pod' label
    # - sourceLabels: [__meta_kubernetes_pod_name]
    #   targetLabel: pod
    # # Fix 2: Map the CNPG cluster label so our queries are clean
    # - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
    #   targetLabel: cnpg_io_cluster
